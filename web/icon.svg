<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Mouser: the Basilisk V3's own silhouette (thumb flare and all), seen from
       above and turned slightly as it sits under your hand, glowing from below. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22323f"/>
      <stop offset="1" stop-color="#121c25"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f7"/>
      <stop offset="1" stop-color="#c9d1d7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <g transform="translate(33 33) rotate(-14) scale(0.118) translate(-122 -214)">
    <!-- light spilling onto the desk -->
    <path d="M40 300 C44 364 80 408 133 410 C194 408 214 352 218 268" fill="none" stroke="#00b4ff" stroke-width="40" stroke-linecap="round" opacity=".55" filter="url(#glow)"/>
    <path d="M40 300 C44 364 80 408 133 410 C194 408 214 352 218 268" fill="none" stroke="#3cc8ff" stroke-width="22" stroke-linecap="round"/>
    <!-- the shell -->
    <path d="M74 58 C86 22 178 22 190 58 C204 108 214 188 210 262 C206 334 190 390 134 396 C84 398 56 372 52 322 C49 286 41 256 30 236 C21 216 33 190 47 174 C58 144 62 98 74 58 Z" fill="url(#shell)"/>
    <path d="M132 34 L132 54 M62 152 Q96 168 132 168 Q168 168 204 152" fill="none" stroke="#7d8a95" stroke-width="7" stroke-linecap="round"/>
    <!-- lit scroll wheel -->
    <rect x="116" y="56" width="32" height="62" rx="16" fill="#00b4ff"/>
  </g>
</svg>
